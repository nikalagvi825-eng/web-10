<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <p id="foodie">foodie.</p>
        <div class="home">
            <a href="#" class="home1">Home</a>
            <a href="#" >Explore</a>
            <a href="#">AI assistant</a>
        </div>
        <div class="logg">
            <p class="login">Log in</p>
            <button class="search">share a recepie</button>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">FRESH IDEAS. EVERYDAY JOY.</p>
                <h1 id="goodf">Good Food <br>
Better together.</h1>
                <p class="intro">Discover recipes worth sharing, from quick weeknight favorites to slow Sunday comforts.</p>
                <form class="recipe-search" role="search">
                    <input type="search" aria-label="Search recipes" placeholder="what are you craving?">
                    <div class="btndown">
                        <button type="submit">Explore recepies</button>
                        <p class="search-note">Made by home cooks, for you.</p>
                    </div>
                </form>
            </div>
            <figure class="hero-image">
              <img src="imgs/Pasta photo.png" alt="">
                <figcaption>Lemon ricotta pasta</figcaption>
            </figure>
        </section>
        <section class="categories" aria-labelledby="categories-title">
            <h2 id="categories-title">Find your flavor</h2>
            <div class="category-list">
                <article class="category-card">
                    <img src="imgs/Pancakes.png" alt="breakfast">
                    <p>Breakfast</p>
                </article>
                <article class="category-card">
                    <img src="imgs/veg.png" alt="vegetarian">
                    <p>Vegetarian</p>
                </article>
                <article class="category-card">
                    <img src="imgs/quick.png" alt="quick & easy">
                    <p>Quick & easy</p>
                </article>
                <article class="category-card">
                    <img src="imgs/dinner.png" alt="Dinner">
                    <p>Dinner</p>
                </article>
                <article class="category-card">
                    <img src="imgs/soups.png" alt="soups">
                    <p>Soups</p>
                </article>
                <article class="category-card">
                    <img src="imgs/cooki.png" alt="Freshly baked cookies">
                    <p>Desserts</p>
                </article>
            </div>
        </section>
    </main>
    <footer></footer>
</body>
</html>
